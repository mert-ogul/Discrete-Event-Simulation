[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/sim"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 0

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Keep checks aligned with historical CI (avoid style churn on report strings / zip strictness).
select = ["E", "F"]
ignore = ["E501"]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
mypy_path = "src"
files = [
  "src/sim",
  "src/customtypes.py",
  "src/build_cleaned_data.py",
  "src/run_simulation_predictive.py",
  "src/run_simulation_interval_arrivals.py",
  "src/run_statistical_analysis.py",
]
