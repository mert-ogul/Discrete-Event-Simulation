# GitLab CI: tests, coverage, lint, dependency scanning.
# https://docs.gitlab.com/ee/ci/coverage/

include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml

default:
  image: python:3.11-slim

stages:
  - test
  - lint

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

unit-tests:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest --cov=sim --cov-report=term --cov-report=xml:coverage.xml -q
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

lint-and-typecheck:
  stage: lint
  needs:
    - unit-tests
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - ruff check src tests
    - black --check src tests
    - mypy --config-file=pyproject.toml
